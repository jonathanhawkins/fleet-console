name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · typecheck · unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Formatting was drifting: `pnpm format` reflowed a dozen unrelated files
      # on every run, so every change arrived carrying someone else's
      # whitespace. Checked here so the tree stays formatted rather than
      # getting re-formatted by whoever next runs the script.
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      # Half the README receipts: the suite's own size, from the run that just
      # happened. The lazy-chunk half needs a build, so the e2e job checks that
      # side against its export — the script reports on whatever it can see.
      - name: README receipts (suite)
        run: node scripts/check-receipts.mjs

  e2e:
    name: Static export · budgets · Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Chromium is ~40% of this job's wall clock when it is downloaded fresh
      # every run. The key is the lockfile, so the cache turns over exactly
      # when the Playwright version does; both jobs use the same key, so the
      # second one to run gets a hit. `install-deps` still runs on a hit
      # because the OS libraries live outside the cached directory.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      # The e2e chain builds the static export itself, runs the five
      # Playwright projects against it, then checks both routes' JS budgets.
      - run: pnpm exec playwright test --project=mobile --repeat-each 3 --retries 0
        env:
          CI: "1"
      - name: Bundle receipt
        if: always()
        run: node scripts/check-budgets.mjs out >> "$GITHUB_STEP_SUMMARY"
      # The other numbers the README prints about itself — suite size, lazy
      # chunk weight. They drifted while nothing was watching them.
      - name: README receipts (bundles)
        run: node scripts/check-receipts.mjs out
      # Same export, served compressed: desktop-preset Lighthouse on / and
      # /unit/N-01 against Playwright's Chromium (installed above). Fails the job
      # when accessibility, best-practices or SEO drop under 100; performance is
      # reported here and gated on documented hardware (docs/perf.md). Writes
      # the reports to docs/evidence/lighthouse/ and posts scores to the summary.
      - name: Lighthouse gate
        run: node scripts/lighthouse.mjs out
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: docs/evidence/lighthouse/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # The 500-unit receipt. Its own job rather than a step in `e2e`, because it
  # builds a second artifact (NEXT_PUBLIC_SIM_UNITS=500) and there is no reason
  # to make the deploy wait behind it — but it is in CI at all because the
  # README prints its numbers as a PASS, and a receipt nothing re-measures is
  # the one row in that table taken on trust.
  stress:
    name: 500-unit scale
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Chromium is ~40% of this job's wall clock when it is downloaded fresh
      # every run. The key is the lockfile, so the cache turns over exactly
      # when the Playwright version does; both jobs use the same key, so the
      # second one to run gets a hit. `install-deps` still runs on a hit
      # because the OS libraries live outside the cached directory.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - run: pnpm e2e:stress
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: stress-traces
          path: test-results/
          retention-days: 7

  deploy:
    name: Deploy static export
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: e2e
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    # Job level, not step level: a step's own `env:` block is not in scope for
    # that same step's `if:`, so the guard below read an empty string forever
    # and the publish never ran while the job still reported success. The live
    # demo went three days stale behind a green check.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:static
      - name: Publish to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm dlx wrangler@4 pages deploy out --project-name fleet-console --branch main
      - name: Report the published commit
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          echo "Deployed \`${GITHUB_SHA:0:7}\` to <https://fleet-console.pages.dev>." >> "$GITHUB_STEP_SUMMARY"
      # A skipped publish is the failure mode this job exists to prevent, so it
      # says so in the run summary instead of passing quietly.
      - name: Say when the publish could not run
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::warning title=Deploy skipped::CLOUDFLARE_API_TOKEN is not set, so https://fleet-console.pages.dev still serves whatever was published last."
          echo "**Deploy skipped.** \`CLOUDFLARE_API_TOKEN\` is not set on this repository, so the live demo is still the previously published build — not \`${GITHUB_SHA:0:7}\`." >> "$GITHUB_STEP_SUMMARY"
